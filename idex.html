<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Birthday Vũ Ngọc Bích ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050814;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    /* Canvas cho pháo hoa background */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Overlay container chung cho UI */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(5, 8, 20, 0.85);
      backdrop-filter: blur(8px);
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Nút START kiểu Neon */
    .btn-neon {
      padding: 18px 52px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00f3ff;
      background: transparent;
      border: 2px solid #00f3ff;
      border-radius: 50px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.4);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .btn-neon:hover, .btn-neon:active {
      background: #00f3ff;
      color: #000;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
      transform: scale(1.05);
    }

    /* Đếm ngược */
    .countdown {
      font-size: 7rem;
      font-weight: 800;
      color: #00f3ff;
      text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; }
    }

    /* Popup thông điệp bùng nổ */
    .card-popup {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #00f3ff;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 35px 30px;
      text-align: center;
      max-width: 85%;
      width: 380px;
      animation: popExplode 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popExplode {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .card-popup h2 {
      font-size: 1.7rem;
      color: #00f3ff;
      text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff;
      line-height: 1.4;
    }

    /* Container chứa các bong bóng lời chúc trôi nổi */
    #bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      background: rgba(10, 25, 47, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      color: #e0f2fe;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: floatUp linear infinite;
      pointer-events: auto;
    }

    .bubble img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 0.95; }
      90% { opacity: 0.95; }
      100% {
        transform: translateY(-20vh) scale(1);
        opacity: 0;
      }
    }

    /* Hiệu ứng Rung màn hình khi bùng nổ */
    .shake-screen {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 5px); }
      40% { transform: translate(10px, -5px); }
      60% { transform: translate(-5px, 10px); }
      80% { transform: translate(5px, -10px); }
    }
  </style>
</head>
<body id="app-body">

  <!-- THAY LINK ÂM THANH ONLINE VÀO NƠI NÀY -->
  <audio id="bg-audio" src="https://files.catbox.moe/qaqm2b.mp3" preload="auto" loop></audio>

  <canvas id="fireworksCanvas"></canvas>

  <div id="start-screen" class="overlay">
    <button class="btn-neon" onclick="startApp()">START</button>
  </div>

  <div id="countdown-screen" class="overlay hidden">
    <div id="countdown-number" class="countdown">12</div>
  </div>

  <div id="greeting-screen" class="overlay hidden">
    <div class="card-popup">
      <h2>Forever Grateful for You.<br>Happy Birthday, Vũ Ngọc Bích ❤️</h2>
    </div>
  </div>

  <div id="bubbles-container"></div>

  <script>
    const bgAudio = document.getElementById('bg-audio');

    window.addEventListener('DOMContentLoaded', () => {
      bgAudio.play().catch(() => {});
    });

    // --- DANH SÁCH LỜI CHÚC (THAY CÁC LINK ẢNH ONLINE TRỰC TIẾP VÀO ĐÂY) ---
    const messages = [
      { text: "Happy Birthday to my General leadership 💖", img: "https://files.catbox.moe/tv32cs.jpg" },
      { text: "Chúc chị mọi bước đi đều tràn ngập hạnh phúc 🎉", img: "https://files.catbox.moe/bnpox1.jpg" },
      { text: "Here's to more beautiful memories together ✨", img: "https://files.catbox.moe/h40qew.jpg" },
      { text: "Forever Grateful for You. Happy Birthday, Vũ Ngọc Bích ❤️", img: "https://files.catbox.moe/cc02ol.jpg" },
      { text: "Chúc mừng sinh nhật chị Bích! 🎂", img: "https://files.catbox.moe/ujnfti.jpg" }
    ];

    function startApp() {
      bgAudio.currentTime = 0;
      bgAudio.play().catch(e => console.log("Audio Error:", e));

      document.getElementById('start-screen').classList.add('hidden');
      const countScreen = document.getElementById('countdown-screen');
      const countNum = document.getElementById('countdown-number');
      countScreen.classList.remove('hidden');

      let count = 12;
      countNum.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.innerText = count;
        } else {
          clearInterval(timer);
          countScreen.classList.add('hidden');
          
          const greetingScreen = document.getElementById('greeting-screen');
          greetingScreen.classList.remove('hidden');
          
          triggerExplosionEffect();
          startFireworksAuto(); 
          spawnBubbles();       

          setTimeout(() => {
            greetingScreen.classList.add('hidden');
          }, 3000); 
        }
      }, 1000);
    }

    function triggerExplosionEffect() {
      const body = document.getElementById('app-body');
      body.classList.add('shake-screen');
      setTimeout(() => body.classList.remove('shake-screen'), 500);

      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const x = Math.random() * (width - 100) + 50;
          const y = Math.random() * (height * 0.6) + 50;
          createFirework(x, y, true);
        }, i * 50);
      }
    }

    let bubbleInterval = null;
    function spawnBubbles() {
      if (bubbleInterval) return;
      const container = document.getElementById('bubbles-container');
      
      bubbleInterval = setInterval(() => {
        const item = messages[Math.floor(Math.random() * messages.length)];
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        const randomX = Math.random() * 65 + 5; 
        const duration = Math.random() * 5 + 7;

        bubble.style.left = `${randomX}%`;
        bubble.style.animationDuration = `${duration}s`;

        let content = '';
        if (item.img) {
          content += `<img src="${item.img}" alt="avatar">`;
        }
        content += `<span>${item.text}</span>`;
        bubble.innerHTML = content;

        container.appendChild(bubble);

        setTimeout(() => {
          bubble.remove();
        }, duration * 1000);
      }, 1400);
    }

    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Particle {
      constructor(x, y, color, isBig = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = isBig ? Math.random() * 3.5 + 1.5 : Math.random() * 2 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = isBig ? Math.random() * 10 + 2 : Math.random() * 6 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05; 
        this.alpha -= this.decay;
      }
    }

    let particles = [];
    const colors = ['#00f3ff', '#ff007f', '#ffbe0b', '#00ff66', '#ffffff', '#ff5000', '#e0aaff'];

    function createFirework(x, y, isBig = false) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const count = isBig ? 70 : 40;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, isBig));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 8, 20, 0.2)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach((p, index) => {
        if (p.alpha > 0) {
          p.update();
          p.draw();
        } else {
          particles.splice(index, 1);
        }
      });

      requestAnimationFrame(animate);
    }

    function startFireworksAuto() {
      setInterval(() => {
        const x = Math.random() * (width - 100) + 50;
        const y = Math.random() * (height * 0.5) + 100;
        createFirework(x, y);
      }, 600);
    }

    window.addEventListener('pointerdown', (e) => {
      if (document.getElementById('countdown-screen').classList.contains('hidden')) {
        createFirework(e.clientX, e.clientY, true);
      }
    });

    animate();
  </script>
</body>
</html>
